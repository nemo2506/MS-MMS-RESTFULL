plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { stream ->
        localProps.load(stream)
    }
}

android {
    namespace 'com.miseservice.msmms'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.miseservice.msmms"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 3
        versionName "0.10"

        // Power / API settings from local.properties (mandatory)
        def apiBaseUrl = localProps.getProperty('api.baseUrl')?.trim()
        def apiBearer = localProps.getProperty('api.bearer')?.trim()
        def chargePinRaw = localProps.getProperty('api.charge.pin')?.trim()
        def endpointStatus = localProps.getProperty('api.endpoint.status')?.trim()
        def endpointPower  = localProps.getProperty('api.endpoint.power')?.trim()
        def serverToken = localProps.getProperty('server.token')?.trim() ?: "default_server_token"

        if (!apiBaseUrl) throw new GradleException("Missing required local.properties entry: api.baseUrl")
        if (!apiBearer) throw new GradleException("Missing required local.properties entry: api.bearer")
        if (!chargePinRaw) throw new GradleException("Missing required local.properties entry: api.charge.pin")
        if (!endpointStatus) throw new GradleException("Missing required local.properties entry: api.endpoint.status")
        if (!endpointPower) throw new GradleException("Missing required local.properties entry: api.endpoint.power")

        def chargePin = chargePinRaw.split('#')[0].trim()
        buildConfigField("String", "API_BASE_URL",        "\"${apiBaseUrl}\"")
        buildConfigField("String", "API_BEARER",          "\"${apiBearer}\"")
        buildConfigField("String", "API_CHARGE_PIN",      "\"${chargePin}\"")
        buildConfigField("String", "API_ENDPOINT_STATUS", "\"${endpointStatus}\"")
        buildConfigField("String", "API_ENDPOINT_POWER",  "\"${endpointPower}\"")
        buildConfigField("String", "SERVER_TOKEN",        "\"${serverToken}\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = libs.versions.composeCompiler.get()
    }

}

dependencies {
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.nanohttpd
    implementation libs.material
    implementation libs.coroutines.android
    implementation libs.security.crypto
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.activity.ktx

    // Hilt
    implementation libs.hilt.android
    kapt libs.hilt.android.compiler
    kapt libs.hilt.compiler
    implementation libs.javax.inject

    // Jetpack Compose — BOM gère toutes les versions Compose
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    implementation libs.compose.ui.tooling.preview
    implementation libs.activity.compose
    implementation libs.lifecycle.runtime.compose
    debugImplementation libs.compose.ui.tooling

    implementation libs.okhttp
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.android.smsmms
    implementation libs.jmdns

    // Room (base, KTX, compiler)
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler


    // Tests
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.coroutines.test
    androidTestImplementation libs.test.ext.junit
    androidTestImplementation libs.test.espresso
}
